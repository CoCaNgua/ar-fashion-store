<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decart AR Fashion Store</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 5%;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ar-badge {
            font-size: 0.7rem;
            background: #22c55e;
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            padding: 1.5rem 5%;
            flex: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 1rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: grab;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: #22c55e;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .drag-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            background: #0f172a;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            border: 1px dashed #475569;
        }

        /* Khung AR Anywear Decart */
        .ar-studio-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 80px;
            height: calc(100vh - 110px);
        }

        .ar-iframe-wrapper {
            flex: 1;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 2px dashed var(--primary);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .ar-instructions {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .ar-studio-container { height: 500px; position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🛍️ Decart Style Studio
            <span class="ar-badge">Powered by Anywear.DecartAI</span>
        </div>
    </header>

    <div class="main-container">
        <section class="products-section">
            <h2>Sản Phẩm Mới Nhất</h2>
            <div class="product-grid" id="productGrid">
                <!-- Sản phẩm nạp tự động từ API -->
            </div>
        </section>

        <!-- Khung nhúng AR Try-On từ Anywear Decart AI -->
        <section class="ar-studio-container">
            <h3>📸 Phòng Thử Đồ AR Live</h3>
            <div class="ar-iframe-wrapper" style="margin-top: 10px;">
                <iframe 
                    id="anywearFrame"
                    src="https://anywear.decart.ai/" 
                    allow="camera; microphone; autoplay;" 
                    title="Anywear AR Fitting Room">
                </iframe>
            </div>
            <p class="ar-instructions">
                💡 <b>Hướng dẫn:</b> Bật camera trong ô trên, sau đó <b>kéo & thả (Drag & Drop)</b> bức ảnh áo quần từ danh sách bên trái vào ô camera để tự động thử đồ trực tiếp lên bạn!
            </p>
        </section>
    </div>

    <script>
        // Cấu hình URL API Backend (Thay bằng URL loca.lt / ngrok khi test remote)
        const API_URL = 'https://elevating-gazing-grunge.ngrok-free.dev/api/products';

        async function fetchProducts() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.success) {
                    renderProducts(result.data);
                } else {
                    console.error('Lỗi nạp dữ liệu:', result.error);
                }
            } catch (error) {
                console.warn('Không thể kết nối API Backend, đang hiển thị dữ liệu mặc định:', error);
                // Dữ liệu Fallback nếu Backend chưa bật
                renderProducts([
                    { id: 1, name: 'Áo T-Shirt Cyberpunk Black', price: 29.99, image_url: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500' },
                    { id: 2, name: 'Áo Hoodie Oversize Streetwear', price: 49.99, image_url: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500' },
                    { id: 3, name: 'Áo Sơ mi Denim Casual', price: 39.99, image_url: 'https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=500' }
                ]);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image_url}" alt="${product.name}" draggable="true" ondragstart="handleDragStart(event, '${product.image_url}')">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">$${product.price}</div>
                    <div class="drag-hint">🖐️ Kéo ảnh này thả vào camera AR</div>
                `;
                container.appendChild(card);
            });
        }

        function handleDragStart(event, imageUrl) {
            event.dataTransfer.setData('text/plain', imageUrl);
            event.dataTransfer.setData('text/uri-list', imageUrl);
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
